                : new Date(TODAY.getFullYear(), TODAY.getMonth(), 1),
              other: false,
              editHrs: false,
            }
        openSheet(renderRequest)
      }
      const rqDays = () =>
        RQ.start ? workDays(RQ.start, RQ.end || RQ.start) : 0
      const rqHrs = () => RQ.hrs ?? rqDays() * HRS_PER_DAY
      function renderRequest() {
        const choice = (t) => {
          const b = balanceOf(t.id)
          return `<button class="pill choice" aria-pressed="${RQ.type === t.id}" data-act="rqType" data-v="${t.id}">${t.short}${b != null ? `<small>${num(b)} days</small>` : ""}</button>`
        }
        const main = LEAVE_TYPES.filter((t) => !t.other),
          others = LEAVE_TYPES.filter((t) => t.other)
        const m = RQ.month,
          y = m.getFullYear(),
          mo = m.getMonth(),
          first = new Date(y, mo, 1),
          last = new Date(y, mo + 1, 0)
        const end = RQ.end || RQ.start
        let cells =
          ["M", "T", "W", "T", "F", "S", "S"]
            .map((d) => `<div class="dow">${d}</div>`)
            .join("") + "<div></div>".repeat((first.getDay() + 6) % 7)
        for (let d = new Date(first); d <= last; d = addDays(d, 1)) {
          const cls = []
          const past = d < TODAY
          if (RQ.start && d >= RQ.start && d <= end) {
            cls.push(sameDay(d, RQ.start) || sameDay(d, end) ? "sel" : "rng")
            if (sameDay(d, RQ.start)) cls.push("s")
            if (sameDay(d, end)) cls.push("e")
          } else if (isWeekend(d) || past) cls.push("wk")
          if (isHoliday(d)) cls.push("hol")
          if (S.team.some((t) => d >= t.start && d <= t.end)) cls.push("away")
          cells += `<button class="c ${cls.join(" ")}" data-act="rqDay" data-v="${iso(d)}" ${past ? "disabled" : ""}>${d.getDate()}</button>`
        }
        const bal = balanceOf(RQ.type),
          after = bal != null ? r2(bal - rqHrs() / HRS_PER_DAY) : null
        const days = rqDays(),
          label = RQ.start
            ? RQ.hrs && RQ.hrs < HRS_PER_DAY * days
              ? `${num(RQ.hrs)} hrs`
              : `${num(days, days % 1 ? 2 : 0)} day${days === 1 ? "" : "s"}`
            : ""
        const away = RQ.start
          ? S.team.filter((t) => t.start <= end && t.end >= RQ.start)
          : []
        const errs = rqProblems(end, days, after)
        return {
          title: RQ.id ? "Edit leave request" : "Request leave",
          tall: true,
          body: `<div class="pills" style="margin-top:4px">${main.map(choice).join("")}${RQ.other ? others.map(choice).join("") : `<button class="pill choice" data-act="rqOther">Other…<small>${others.length} more types</small></button>`}</div>
            <div class="cal-head"><button class="icon-btn plain" data-act="rqMonth" data-v="-1" aria-label="Previous month">${ico("back")}</button><b>${MONTH[mo]} ${y}</b><button class="icon-btn plain" data-act="rqMonth" data-v="1" aria-label="Next month">${ico("chev")}</button></div>
            <div class="cal">${cells}</div>
            <p class="small muted" style="margin:6px 0 0">${RQ.start ? (RQ.end ? "Tap a new first day to start again." : "Tap the last day, or submit for one day.") : "Tap your first day off."}</p>
            ${
              RQ.start
                ? `<div class="list" style="margin-top:6px">
              <div class="row"><span class="main"><span class="t">${range(RQ.start, end)}</span><span class="s tnum">${num(days, 0)} working day${days === 1 ? "" : "s"} · ${num(rqHrs())} hrs</span></span><button class="link" data-act="rqEditHrs">${RQ.editHrs ? "Done" : "Edit hours"}</button></div>
              ${RQ.editHrs ? `<div class="field" style="margin:0 0 12px"><label for="rq-hrs">Hours (for part days)</label><input class="input" id="rq-hrs" inputmode="decimal" data-in="rqHrs" value="${num(rqHrs())}" /></div>` : ""}
              ${after != null ? `<div class="kv"><span class="k">${typeName(RQ.type)} after this</span><span class="v" id="rq-after" style="color:${after < 0 ? "var(--danger-500)" : "var(--success-700)"}">${num(after)} days</span></div>` : ""}
              ${away.length ? `<div class="kv"><span class="k">Also away</span><span class="v">${away.map((a) => a.name.split(" ")[0]).join(", ")}</span></div>` : ""}
            </div>`
                : ""
            }
            ${errs.length ? `<div class="formerr" role="alert">${errs.map((m) => `<div>${ico("alert")}<span>${m}</span></div>`).join("")}</div>` : ""}
            ${RQ.showNote ? `<div class="field"><label for="rq-note">Note for ${ME.approver} <span class="opt">(optional)</span></label><textarea class="input" id="rq-note" data-in="rqNote">${esc(RQ.note)}</textarea></div>` : `<p style="margin:16px 0 0"><button class="link" data-act="rqNoteShow">+ Add a note for ${ME.approver}</button></p>`}`,
          foot: `<button class="btn primary" data-act="rqSubmit" id="rq-go" ${RQ.start && !errs.length ? "" : "disabled"}>${RQ.start ? `Submit ${label}` : "Choose your dates"}</button><button class="btn" style="height:44px;margin-top:4px;font-size:15px;color:var(--ink-700)" data-act="rqDraft" ${RQ.start ? "" : "disabled"}>Save as draft</button>`,
        }
      }
      function saveRequest(status) {
        const data = {
          type: RQ.type,
          start: RQ.start,
          end: RQ.end || RQ.start,
          hrs: RQ.hrs && RQ.hrs !== rqDays() * HRS_PER_DAY ? RQ.hrs : undefined,
          note: RQ.note,
          status,
        }
        if (RQ.id)
          Object.assign(
            S.requests.find((r) => r.id === RQ.id),
            data,
          )
        else S.requests.push({ id: "l" + uid++, ...data })
        if (status === "sent")
          S.activity.unshift({
            t: typeName(RQ.type),
            s: `${range(data.start, data.end)} · sent to ${ME.approver}`,
            chip: ["sent", "Sent"],
            go: "leave",
          })
        closeSheet()
        render()
        toast(
          status === "sent"
            ? `Leave request sent to ${ME.approver}`
            : "Saved as a draft",
        )
      }
      function reqDetail(id) {
        openSheet(() => {
          const r = S.requests.find((x) => x.id === id)
          if (!r) return { title: "", body: "" }
          const acts =
            r.status === "draft"
              ? `<div class="stack"><button class="btn primary" data-act="reqSend" data-id="${id}">Send to ${ME.approver}</button><button class="btn secondary" data-act="reqEdit" data-id="${id}">Edit</button><button class="btn ghost-danger" data-act="reqDelete" data-id="${id}">Delete draft</button></div>`
              : r.status === "declined"
                ? `<button class="btn secondary" data-act="reqEdit" data-id="${id}">Edit and resend</button>`
                : r.end >= TODAY
                  ? `<button class="btn ghost-danger" data-act="reqCancel" data-id="${id}">${r.status === "approved" ? "Cancel this leave" : "Withdraw request"}</button>`
                  : ""
          return {
            title: typeName(r.type),
            body: `<div style="margin-top:6px">${chip(...STATUS[r.status])}</div>${kvs([["Dates", range(r.start, r.end)], ["Amount", reqAmount(r)], ["Approver", ME.approver], ...(r.note ? [["Note", esc(r.note)]] : [])])}`,
            foot: acts,
          }
        })
      }
      function removeReq(id, label) {
        const i = S.requests.findIndex((r) => r.id === id)
        if (i < 0) return
        const [r] = S.requests.splice(i, 1)
        closeSheet()
        render()
        toast(label, () => {
          S.requests.splice(i, 0, r)
          render()
        })
      }

      // ---- projected ----
      let PJ = null
      function projected() {
        PJ = { type: "annual", date: "2026-12-14", wk: 37.5 }
        openSheet(() => ({
          title: "Future balance",
          body:
            pills(
              [
                ["annual", "Annual"],
                ["lieu", "Lieu"],
              ],
              PJ.type,
              "pjType",
            ) +
            `<div class="row2"><div class="field"><label for="pj-d">On date</label><input class="input" type="date" id="pj-d" data-in="pjDate" value="${PJ.date}" min="${iso(TODAY)}" /></div><div class="field"><label for="pj-w">Avg weekly hours</label><input class="input" id="pj-w" data-in="pjWk" inputmode="decimal" value="${PJ.wk}" /></div></div>
            <div style="margin:26px 0 6px"><div class="big" id="pj-out">${pjCalc()}</div><p class="center muted small" id="pj-sub" style="margin:4px 0 0">${pjSub()}</p></div>
            <p class="small muted center" style="margin-top:14px">An estimate based on pay to 31 May 2026 and your anniversary on 4 May. Approved leave before that date is taken off.</p>`,
          foot: `<button class="btn secondary" data-act="pjRequest">Request leave from this date</button>`,
        }))
      }
      function pjDays() {
        const d = fromIso(PJ.date)
        if (PJ.type === "lieu") return S.balances.lieu
        const accrue = Math.max(0, (d - D(2026, 5, 31)) / 864e5) * (15 / 365)
        const booked = S.requests
          .filter(
            (r) =>
              r.type === "annual" &&
              r.status === "approved" &&
              r.start >= TODAY &&
              r.start <= d,
          )
          .reduce((a, r) => a + reqDays(r), 0)
        return r2(annualAvail() + accrue - booked)
      }
      const pjCalc = () => `${num(pjDays())} days`
      const pjSub = () =>
        `≈ ${num((pjDays() * (Number(PJ.wk) || 37.5)) / 5)} hrs of ${typeName(PJ.type).toLowerCase()} on ${fd(fromIso(PJ.date), { dow: true, y: true })}`
      function balDetail(id) {
        const a = S.balances.annual
        const booked = S.requests
          .filter(
            (r) =>
              r.type === "annual" &&
              r.status === "approved" &&
              r.start >= TODAY,
          )
          .reduce((x, r) => x + reqDays(r), 0)
        const rows =
          id === "annual"
            ? [
                ["Entitled on 4 May 2026", unitFmt(a.entitled)],
                ["Accrued since then", unitFmt(a.accrued)],
                ["Available now", `<b>${unitFmt(annualAvail())}</b>`],
                ["Booked and approved", "−" + unitFmt(booked)],
                ["Left after booked leave", unitFmt(annualAvail() - booked)],
              ]
            : [
                ["Earned · Matariki 2025", unitFmt(1)],
                ["Used", "−" + unitFmt(0.75)],
                ["Available", `<b>${unitFmt(S.balances.lieu)}</b>`],
              ]
        openSheet(() => ({
          title: typeName(id),
          body: kvs(rows),
          foot: `<button class="btn primary" data-act="requestLeave" data-v="${id}">Request ${typeName(id).toLowerCase()}</button>`,
        }))
      }

      // ---- timelog add / edit ----
      let TL = null
      function openTime(dateIso, entry) {
        TL = entry
          ? {
              date: dateIso,
              id: entry.id,
              type: entry.type,
              start: entry.start,
              end: entry.end,
              hrs: entry.hrs,
              manual: !entry.start,
              note: entry.note || "",
              showNote: !!entry.note,
            }
          : {
              date: dateIso,
              type: "Ordinary time",
              start: "08:00",
              end: "12:00",
              hrs: 4,
              manual: false,
              note: "",
              showNote: false,
            }
        openSheet(renderTime)
      }
      function renderTime() {
        const d = fromIso(TL.date)
        return {
          title: `${TL.id ? "Edit" : "Add"} time · ${fd(d, { dow: true })}`,
          body:
            pills(
              [
                ["Ordinary time", "Ordinary"],
                ["Overtime", "Overtime"],
                ["On call", "On call"],
              ],
              TL.type,
              "tlType",
            ) +
            `<div class="row2"><div class="field"><label for="tl-s">Start</label><input class="input" type="time" id="tl-s" data-in="tlStart" value="${TL.start}" /></div><div class="field"><label for="tl-e">End</label><input class="input" type="time" id="tl-e" data-in="tlEnd" value="${TL.end}" /></div></div>
            <div id="tl-err">${tlErrHtml()}</div>
            <div class="field"><label for="tl-h">Hours <span class="opt">(worked out from your times)</span></label><input class="input tnum" id="tl-h" data-in="tlHrs" inputmode="decimal" value="${num(TL.hrs)}" /></div>
            <div class="pills">${[4, 7.5, 8].map((h) => `<button class="pill" data-act="tlDur" data-v="${h}">${h} h</button>`).join("")}<button class="pill" data-act="tlBreak">− 30 min break</button></div>
            ${TL.showNote ? `<div class="field"><label for="tl-n">Note for ${ME.approver} <span class="opt">(optional)</span></label><textarea class="input" id="tl-n" data-in="tlNote">${esc(TL.note)}</textarea></div>` : `<p style="margin:16px 0 0"><button class="link" data-act="tlNoteShow">+ Add a note</button></p>`}`,
          foot: `<button class="btn primary" id="tl-go" data-act="tlSave" ${tlProblems().errs.length ? "disabled" : ""}>Save ${num(TL.hrs)} hrs</button>${TL.id ? `<button class="btn ghost-danger" data-act="tlDelete">Delete timelog</button>` : ""}`,
        }
      }
      function tlSync() {
        const h = $("#tl-h"),
          g = $("#tl-go"),
          box = $("#tl-err")
        if (h && !TL.manual) h.value = num(TL.hrs)
        if (box) box.innerHTML = tlErrHtml()
        if (g) {
          g.textContent = `Save ${num(TL.hrs)} hrs`
          g.disabled = tlProblems().errs.length > 0
        }
      }
      function tlProblems() {
        const errs = [],
          warns = []
        if (TL.start && TL.end && TL.end <= TL.start)
          errs.push("End time needs to be after the start time")
        else if (TL.hrs > 16)
          errs.push("That's more than 16 hours in a day — check your times")
        else if (!(TL.hrs > 0)) errs.push("Enter the hours you worked")
        const clash = dayLogs(TL.date).some(
          (e) =>
            e.id !== TL.id &&
            e.start &&
            TL.start &&
            TL.end &&
            TL.start < e.end &&
            TL.end > e.start,
        )
        if (clash) warns.push("This overlaps another entry on this day")
        return { errs, warns }
      }
      const tlErrHtml = () => {
        const { errs, warns } = tlProblems()
        return (
          errs
            .map(
              (m) =>
                `<div class="err-msg" role="alert">${ico("alert")}${m}</div>`,
            )
            .join("") +
          warns
            .map((m) => `<div class="warn-msg">${ico("info")}${m}</div>`)
            .join("")
        )
      }
      function removeLog(id) {
        for (const [dt, list] of Object.entries(S.logs)) {
          const i = list.findIndex((e) => e.id === id)
          if (i >= 0) {

            closeSheet()
            render()
            toast("Timelog deleted", () => {
              list.splice(i, 0, e)
              render()
            })
            return
          }
        }
      }

      // ---- donations ----

          ? {
              step: "amount",

            }

      }
      const dgList = () =>
        CHARITIES.filter((c) =>

            row({

      const dgCta = () =>
        DG.amt > 0
          ? `${DG.editId ? "Save" : "Donate"} ${money(DG.amt).replace(".00", "")} ${DG.freq === "once" ? "once" : "every pay"}`
          : "Enter an amount"
      const dgCredit = () =>
        `<b>You get ${money(donCredit(DG.amt || 0))} back</b>as a tax credit ${DG.freq === "once" ? "in the same pay" : "each pay"}. Real cost to you: ${money((DG.amt || 0) - donCredit(DG.amt || 0))}.`
      function renderDonation() {

      function changeReq(kind) {

        openSheet(() => ({

      // ---- password rules ----
      const COMMON = [
        "password",
        "password1",
        "12345678",
        "qwerty123",

      ]
      function pwChecks() {
        const cur = $("#pw0")?.value || "",
          np = $("#pw1")?.value || "",
          cf = $("#pw2")?.value || ""
        const seq =
          /(.)\1\1/.test(np) ||
          /(012|123|234|345|456|567|678|789|abc|bcd|cde|def)/i.test(np)
        return {
          cur: !!cur,
          len: np.length >= 8,
          seq: np.length > 0 && !seq,
          common: np.length > 0 && !COMMON.includes(np.toLowerCase()),
          match: cf.length > 0 && cf === np,
        }
      }
      function paintPw() {
        const c = pwChecks(),
          li = (ok, t) =>
            `<div class="${ok ? "ok" : ""}">${ico(ok ? "check" : "dot")}${t}</div>`
        $("#pw-rules").innerHTML =
          li(c.len, "8 or more characters") +
          li(c.seq, "No repeated or sequential characters (aaa, 123)") +
          li(c.common, "Not a common password")
        $("#pw-match").innerHTML = li(c.match, "Passwords match")
        $("#pw-save").disabled = !(
          c.cur &&
          c.len &&
          c.seq &&
          c.common &&
          c.match
        )
      }

      function checkPin() {
        if (PIN === "12345") {
          S.pinTries = 0
          auth.hidden = true
          toast("Unlocked")
          return
        }
        S.pinTries++
        const left = 5 - S.pinTries,
          m = $("#pin-msg"),
          d = $("#dots")
        d.classList.add("err")
        m.style.color = "var(--danger-500)"
        if (left <= 0) {
          m.textContent = "Too many attempts — signing you out"
          setTimeout(() => {
            S.pinTries = 0
            showLogin()
            toast("For your security, sign in again", null, "", "err")

        } else
          m.textContent = `Wrong PIN · ${left} ${left === 1 ? "try" : "tries"} left`

          if (openSw.contains(e.target)) return
        }
        const a = e.target.closest("[data-act]"),
          g = e.target.closest("[data-go]")
        const t = a && g ? (a !== g && a.contains(g) ? g : a) : a || g
        if (!t || t.disabled) return
        if (t.dataset.act) {
          const fn = ACT[t.dataset.act]
          if (fn) {
            e.preventDefault()
            fn(t, e)
          }
        } else go(t.dataset.go)
      })
      // inputs that update state without a full re-render (keeps focus)
      $("#phone").addEventListener("input", (e) => {
        const el = e.target,
          k = el.dataset.in
        if (!k) return
        if (k === "pw") paintPw()
        if (k === "rqNote") RQ.note = el.value
        if (k === "rqHrs") {
          const v = parseFloat(el.value)
          RQ.hrs = isNaN(v) ? null : v
          const a = $("#rq-after"),
            b = balanceOf(RQ.type)
          if (a && b != null) {
            const af = r2(b - rqHrs() / HRS_PER_DAY)
            a.textContent = `${num(af)} days`
            a.style.color = af < 0 ? "var(--danger-500)" : "var(--success-700)"
          }
        }
        if (k === "pjDate" && el.value) {
          PJ.date = el.value
          $("#pj-out").textContent = pjCalc()
          $("#pj-sub").textContent = pjSub()
        }
        if (k === "pjWk") {
          PJ.wk = el.value
          $("#pj-sub").textContent = pjSub()
        }
        if (k === "tlStart" || k === "tlEnd") {
          TL[k === "tlStart" ? "start" : "end"] = el.value
          if (!TL.manual || (TL.start && TL.end)) {
            TL.hrs = r2(hoursBetween(TL.start, TL.end))
            TL.manual = false
          }
          tlSync()
        }
        if (k === "tlHrs") {
          TL.hrs = parseFloat(el.value) || 0
          TL.manual = true
          tlSync()
        }
        if (k === "tlNote") TL.note = el.value
        if (k === "dgQ") {
          DG.q = el.value
          $("#dg-list").innerHTML = dgList()
        }
        if (k === "dgAmt") {
          DG.amt = parseFloat(el.value.replace(/[^0-9.]/g, "")) || 0
          $("#dg-credit").innerHTML = dgCredit()
          const g = $("#dg-go")
          g.textContent = dgCta()
          g.disabled = !(DG.amt > 0)
          $$('[data-act="dgPreset"]').forEach((b) =>
            b.setAttribute("aria-pressed", +b.dataset.v === DG.amt),
          )
        }
        if (k === "dgContact") DG.contact = el.checked
        if (k === "code") {
          el.value = el.value.replace(/\D/g, "").slice(-1)
          const boxes = $$('[data-in="code"]')
          if (el.value && +el.dataset.i < 5) boxes[+el.dataset.i + 1].focus()
          $("#code-go").disabled = !boxes.every((b) => b.value)
        }
      })
      $("#phone").addEventListener("change", (e) => {
        if (e.target.dataset.in === "dgContact") DG.contact = e.target.checked
      })
      $("#phone").addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeSheet()
          closeDialog()
        }
        const el = e.target
        if (
          el.dataset &&
          el.dataset.in === "code" &&
          e.key === "Backspace" &&
          !el.value &&
          +el.dataset.i > 0
        )
          $$('[data-in="code"]')[+el.dataset.i - 1].focus()
      })
      $("#phone").addEventListener("paste", (e) => {
        const el = e.target
        if (!el.dataset || el.dataset.in !== "code") return
        const digits = (e.clipboardData.getData("text") || "")
          .replace(/\D/g, "")
          .slice(0, 6)
        if (!digits) return
        e.preventDefault()
        const boxes = $$('[data-in="code"]')
        digits.split("").forEach((d, i) => (boxes[i].value = d))
        boxes[Math.min(5, digits.length)].focus()
        $("#code-go").disabled = !boxes.every((b) => b.value)
      })

      // swipe-to-delete (pointer events: touch and mouse)
      let SW = null
      view.addEventListener("pointerdown", (e) => {
        const r = e.target.closest(".swipe > .row")
        if (!r) return
        SW = {
          row: r,
          x: e.clientX,
          y: e.clientY,
          base: r.parentElement.classList.contains("open") ? -88 : 0,
          moved: false,
        }
      })
      view.addEventListener("pointermove", (e) => {
        if (!SW) return
        const dx = e.clientX - SW.x,
          dy = e.clientY - SW.y
        if (!SW.moved && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy))
          SW.moved = true
        if (SW.moved) {
          SW.row.style.transition = "none"
          SW.row.style.transform = `translateX(${Math.max(-120, Math.min(0, SW.base + dx))}px)`
        }
      })
      window.addEventListener("pointerup", (e) => {
        if (!SW) return
        const { row: r, moved, base, x } = SW
        SW = null
        r.style.transition = ""
        r.style.transform = ""
        if (moved) {
          $$(".swipe.open").forEach(
            (s) => s !== r.parentElement && s.classList.remove("open"),
          )
          r.parentElement.classList.toggle("open", base + (e.clientX - x) < -44)
          suppressClick = true
          setTimeout(() => (suppressClick = false), 50)
        }
      })

      // =====================================================================
      // v5 LAYER · validation, error states, offline + loading simulation
      // =====================================================================
      function fieldErr(id, msg) {
        const inp = document.getElementById(id)
        if (!inp) return
        const f = inp.closest(".field")
        if (!f) return
        f.classList.add("err")
        let m = f.querySelector(".err-msg")
        if (!m) {
          m = document.createElement("div")
          m.className = "err-msg"
          m.setAttribute("role", "alert")
          f.appendChild(m)
        }
        m.innerHTML = ico("alert") + msg
      }
      function clearErrs(root = document) {
        $$(".field.err", root).forEach((f) => {
          f.classList.remove("err")
          f.querySelector(".err-msg")?.remove()
        })
      }
      function rqProblems(end, days, after) {
        const out = []
        if (!RQ.start) return out
        if (!days && !RQ.hrs)
          out.push("Those dates don't include any working days.")
        if (after != null && after < 0)
          out.push(
            `Not enough ${typeName(RQ.type).toLowerCase()} — you'd be ${num(-after)} days over. Choose fewer days, or use leave without pay.`,
          )
        const clash = S.requests.find(
          (r) =>
            r.id !== RQ.id &&
            r.status !== "declined" &&
            r.start <= end &&
            r.end >= RQ.start,
        )
        if (clash)
          out.push(
            `Overlaps your ${typeName(clash.type).toLowerCase()} on ${range(clash.start, clash.end)} (${STATUS[clash.status][1].toLowerCase()}).`,
          )
        return out
      }
      const dgErr = () =>
        !(DG.amt > 0)
          ? "Enter an amount"
          : DG.amt < 1
            ? "The minimum donation is $1"
            : DG.amt > 1000
              ? "The maximum is $1,000 per pay — contact the charity for larger gifts"
              : ""
      const dgErrHtml = () => {
        const e = dgErr()
        return e && DG.amt > 0
          ? `<div class="err-msg" role="alert">${ico("alert")}${e}</div>`
          : ""
      }
      let CRK = null

      // extra live validation (runs after the main input handler)
      $("#phone").addEventListener("input", (e) => {
        const el = e.target
        const f = el.closest && el.closest(".field.err")
        if (f) {
          f.classList.remove("err")
          f.querySelector(".err-msg")?.remove()
        }
        if (el.dataset && el.dataset.in === "dgAmt") {
          $("#dg-err").innerHTML = dgErrHtml()
          $("#dg-go").disabled = !!dgErr()
        }
        if (el.dataset && el.dataset.in === "code") {
          $("#code-err")?.remove()
        }
      })

      const origACT = { ...ACT }
      Object.assign(ACT, {
        simOffline: () => {
          S.offline = !S.offline
          render()
          toast(
            S.offline
              ? "Offline simulation on — saves will fail"
              : "Back online",
          )
        },
        simSkeleton: () => {
          S.skeleton = !S.skeleton
          render()
        },
        resetDemo: () =>
          openDialog({
            title: "Reset demo data?",
            text: "Puts every screen back to how it started.",
            ok: "Reset",
            onOk: () => location.reload(),
          }),
        errHelp: () =>
          openDialog({
            title: "Error states to try",
            cancel: "",
            ok: "Got it",
            html: `<div class="list">
            <div class="kv"><span class="k">Request leave</span><span class="v">Pick 13 Jul – 21 Aug (too long), or 22 Jun (overlaps)</span></div>
            <div class="kv"><span class="k">Add time</span><span class="v">End before start, or over 16 hrs</span></div>
            <div class="kv"><span class="k">Donate</span><span class="v">$0.50 or $2,000</span></div>
            <div class="kv"><span class="k">Personal details</span><span class="v">Postcode 80, bad email, phone 123</span></div>
            <div class="kv"><span class="k">Bank change</span><span class="v">Any number not like 00-0000-0000000-00</span></div>
            <div class="kv"><span class="k">Password</span><span class="v">Current password under 6 characters</span></div>
            <div class="kv"><span class="k">Two-factor</span><span class="v">Code 000000</span></div>
            <div class="kv"><span class="k">Lock screen</span><span class="v">Wrong PIN 5 times</span></div>
            <div class="kv"><span class="k">Sign in</span><span class="v">Password under 8 characters</span></div>
            <div class="kv"><span class="k">Anything that saves</span><span class="v">Turn on Simulate offline</span></div></div>`,
          }),
        tlSave: (el, e) => {
          if (tlProblems().errs.length) return
          origACT.tlSave(el, e)
        },
        dgSave: (el, e) => {
          if (dgErr()) {
            $("#dg-err").innerHTML =
              `<div class="err-msg" role="alert">${ico("alert")}${dgErr()}</div>`
            return
          }
          origACT.dgSave(el, e)
        },
        rqSubmit: (el, e) => {
          if ($("#rq-go")?.disabled) return
          origACT.rqSubmit(el, e)
        },
        saveDetail: (el, e) => {
          const k = el.dataset.v,
            v = (id) => ($("#ed-" + id)?.value || "").trim()
          clearErrs(layer)
          let bad = false
          const need = (id, msg) => {
            fieldErr("ed-" + id, msg)
            bad = true
          }
          if (k === "address") {
            if (!v("line1")) need("line1", "Enter your street address")
            if (!v("city")) need("city", "Enter your town or city")
            if (!/^\d{4}$/.test(v("post")))
              need("post", "NZ postcodes are 4 digits")
          }
          if (
            k === "phone" &&
            v("phone") &&
            !/^(\+?64|0)2\d{7,9}$/.test(v("phone").replace(/[\s-]/g, ""))
          )
            need("phone", "Enter a NZ mobile number, like 021 123 4567")
          if (
            k === "email" &&
            !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v("email"))
          )
            need("email", "Enter a valid email address, like name@example.com")
          if (!bad) origACT.saveDetail(el, e)
        },
        changeReq: (el, e) => {
          CRK = el.dataset.v
          origACT.changeReq(el, e)
        },
        sendReq: (el, e) => {
          const val = ($("#cr-1")?.value || "").trim()
          clearErrs(layer)
          if (CRK === "name" && val.length < 3)
            return fieldErr("cr-1", "Enter your full legal name")
          if (CRK === "bank" && !/^\d{2}-\d{4}-\d{7}-\d{2,3}$/.test(val))
            return fieldErr("cr-1", "Use the format 00-0000-0000000-00")
          if (CRK === "ird" && !/^\d{2,3}-?\d{3}-?\d{3}$/.test(val))
            return fieldErr("cr-1", "IRD numbers are 8 or 9 digits")
          origACT.sendReq(el, e)
        },
        savePw: (el, e) => {
          if (($("#pw0").value || "").length < 6) {
            fieldErr("pw0", "That isn't your current password")
            $("#pw0").focus()
            return
          }
          origACT.savePw(el, e)
        },
        verify2fa: (el, e) => {
          const code = $$('[data-in="code"]')
            .map((b) => b.value)
            .join("")
          if (/^(\d)\1{5}$/.test(code)) {
            $$('[data-in="code"]').forEach((b) => (b.value = ""))
            $$('[data-in="code"]')[0].focus()
            $("#code-go").disabled = true
            $(".codes").insertAdjacentHTML(
              "afterend",
              `<div class="err-msg" id="code-err" role="alert">${ico("alert")}That code didn't work. Codes change every 30 seconds — try the newest one.</div>`,
            )
            return
          }
          origACT.verify2fa(el, e)
        },
        browserSignIn: () => {
          clearErrs(auth)
          $("#b-err").innerHTML = ""
          const em = $("#bem").value.trim(),
            pw = $("#bpw").value
          let bad = false
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)) {
            fieldErr("bem", "Enter the email you use for iPayroll")
            bad = true
          }
          if (!pw) {
            fieldErr("bpw", "Enter your password")
            bad = true
          }
          if (bad) return
          if (pw.length < 8) {
            $("#b-err").innerHTML =
              `<div class="formerr" role="alert"><div>${ico("alert")}<span>Email or password is incorrect. After 2 more tries your account will be locked for 15 minutes.</span></div></div>`
            $("#bpw").value = ""
            $("#bpw").focus()
            return
          }
          if (S.offline) {
            $("#b-err").innerHTML =
              `<div class="formerr" role="alert"><div>${ico("alert")}<span>Can't reach iPayroll. Check your connection and try again.</span></div></div>`
            return
          }
          enterApp()
        },
      })
      // anything that sends data fails politely while "offline"
      const NEEDS_NET = {
        rqSubmit: "send your leave request",
        rqDraft: "save the draft",
        reqSend: "send the request",
        tlSave: "save your time",
        approve: "send your timelogs",
        dgSave: "set up the donation",
        saveDetail: "save your details",
        sendReq: "send the request",
        savePw: "change your password",
        verify2fa: "turn on two-factor",
        selDownload: "download payslips",
        downloadPay: "download the payslip",
        downloadTax: "download the summary",
        donReceipt: "download the receipt",
        copyDay: "copy the entries",
      }
      for (const [k, label] of Object.entries(NEEDS_NET)) {
        const fn = ACT[k]
        ACT[k] = (el, e) => {
          if (S.offline) {
            toast(
              `Couldn't ${label} — you're offline`,
              () => ACT[k](el, e),
              "Retry",
              "err",
            )
            return
          }
          return fn(el, e)
        }
      }
      // ---------- boot ----------
      render(true)
      setTimeout(() => ($("#splash").hidden = true), 900)
    </script>
  </body>
</html>
